name: CI

# 内容平台是 npm workspaces：在仓库根用 npm ci 一次装齐两个前端工作区，
# 再用 --workspace 分别跑各自脚本，不绕开 workspace 机制。
# data-hub 是零依赖标准库服务，单独用 Python job 跑 pytest。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node-tests:
    name: api-server & studio-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: api-server tests
        run: |
          set +e
          npm --workspace apps/api-server test > api-server-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E '^(not ok|# fail|# pass|Error)' api-server-test.log | head -30 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          cat api-server-test.log
          exit "$code"

      - name: studio-web tests
        run: |
          set +e
          npm --workspace apps/studio-web test > studio-web-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E '^(not ok|# fail|# pass|Error)' studio-web-test.log | head -30 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          cat studio-web-test.log
          exit "$code"

      - name: studio-web build
        run: npm --workspace apps/studio-web run build

  data-hub:
    name: data-hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Test
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E '^(FAILED|ERROR|[0-9]+ (failed|passed))' pytest-output.txt | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          cat pytest-output.txt
          exit "$code"
